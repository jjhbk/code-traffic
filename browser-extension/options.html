<!doctype html>
<meta charset="utf-8">
<title>Signal Box Browser Bridge</title>
<style>body{font:15px system-ui;max-width:560px;margin:40px auto;padding:0 20px}label{display:block;margin:18px 0 6px}input{width:100%;padding:9px;box-sizing:border-box}button{margin-top:18px;padding:9px 14px}</style>
<h1>Signal Box Browser Bridge</h1>
<p>Pair this extension with the local Signal Box instance. The token is stored in extension storage and sent only to 127.0.0.1.</p>
<label for="token">Signal Box pairing token</label>
<input id="token" type="password" autocomplete="off">
<label for="session">Browser session ID</label>
<input id="session" placeholder="session-1">
<label for="host">Signal Box host URL</label>
<input id="host" value="http://127.0.0.1:4747" placeholder="http://127.0.0.1:4747">
<button id="save">Save pairing</button><span id="status"></span>
<script src="options.js"></script>
